{% extends 'base.html' %}
{% block title %}نقل بين مستودعات{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="card form-card p-4">
            <h3 class="mb-4"><i class="bi bi-arrow-left-right"></i> نقل مخزون بين المستودعات</h3>
            <form method="post">
                {% csrf_token %}
                {% if form.non_field_errors %}<div class="alert alert-danger">{{ form.non_field_errors.0 }}</div>{% endif %}
                {% for field in form %}
                <div class="mb-3">
                    <label class="form-label">{{ field.label }}</label>
                    {{ field }}
                </div>
                {% endfor %}
                <button type="submit" class="btn btn-primary">تنفيذ النقل</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
