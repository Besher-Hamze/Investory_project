{% extends 'base.html' %}
{% block title %}حذف منتج{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card form-card p-4 text-center">
            <h4>هل تريد حذف المنتج؟</h4>
            <p class="text-muted">{{ product.name }} ({{ product.sku }})</p>
            <form method="post" class="d-flex justify-content-center gap-2">
                {% csrf_token %}
                <button type="submit" class="btn btn-danger">نعم، حذف</button>
                <a href="{% url 'product_list' %}" class="btn btn-secondary">إلغاء</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
